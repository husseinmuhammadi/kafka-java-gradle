plugins {
    id 'java'
    id 'application'
}

group 'com.javastudio.kafka'
version '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.javastudio.kafka.Application'
}

dependencies {
    compileOnly 'org.slf4j:slf4j-api:2.0.6'
    implementation 'ch.qos.logback:logback-classic:1.4.5'
    implementation 'org.apache.kafka:kafka-clients:3.1.2'
}

test {
    useJUnitPlatform()
}
