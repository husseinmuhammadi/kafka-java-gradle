plugins {
    id 'java'
    id 'application'
}

group 'com.javastudio.kafka'
version '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.javastudio.kafka.Application'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}